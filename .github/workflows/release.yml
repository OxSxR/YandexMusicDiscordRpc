name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to upload the asset to'
        required: true
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || 'main' }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish application
        shell: pwsh
        run: ./publish.ps1 -Runtime win-x64

      - name: Verify distribution files
        shell: pwsh
        run: |
          $required = @('README.md', 'LICENSE', 'THIRD-PARTY-NOTICES.md', 'YandexMusicRPC.exe')
          foreach ($name in $required) {
            $path = Join-Path 'dist/win-x64' $name
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Missing required file: $path"
            }
          }

      - name: Create release archive
        shell: pwsh
        run: |
          $version = "$env:RELEASE_TAG"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "v1.0.0"
          }
          Compress-Archive -Path dist/win-x64/* -DestinationPath "YandexMusicRPC-$version-win-x64.zip" -Force

      - name: Upload release asset
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = "$env:RELEASE_TAG"
          if ([string]::IsNullOrWhiteSpace($version)) {
            $version = "v1.0.0"
          }
          gh release upload $version "YandexMusicRPC-$version-win-x64.zip" --clobber

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: YandexMusicRPC-win-x64
          path: YandexMusicRPC-*-win-x64.zip
          if-no-files-found: error
